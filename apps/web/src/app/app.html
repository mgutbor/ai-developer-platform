<main class="foundation-shell">
  <header class="hero" aria-labelledby="page-title">
    <p class="eyebrow">Foundation ready</p>
    <h1 id="page-title">AI Developer Platform</h1>
    <p class="intro">A maintainable foundation for evidence-based repository analysis.</p>
  </header>

  <section class="status-card" aria-labelledby="api-status-title">
    <div>
      <p class="eyebrow">Runtime check</p>
      <h2 id="api-status-title">API connection</h2>
    </div>

    <p
      class="status"
      [class.status--online]="apiStatus() === 'online'"
      [class.status--unavailable]="apiStatus() === 'unavailable'"
      role="status"
      aria-live="polite"
    >
      {{ apiStatusLabel() }}
    </p>

    @if (apiStatus() === 'unavailable') {
      <button type="button" (click)="checkApiHealth()">Retry connection</button>
    }
  </section>
</main>

<router-outlet />
